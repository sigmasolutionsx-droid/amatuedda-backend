<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scout-Faire - Strategic Market Intelligence</title>

    body { margin: 0; padding: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const Icon = ({ children, className = '', size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>{children}</svg>
    );
    const TrendingUp = () => <Icon><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></Icon>;
    const Search    = () => <Icon><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></Icon>;
    const Loader2   = () => <Icon className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></Icon>;
    const AlertCircle = () => <Icon><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
    const Download  = () => <Icon><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Icon>;
    const Lightbulb = () => <Icon><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></Icon>;
    const BarChart3 = () => <Icon><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></Icon>;
    const Shield    = () => <Icon><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></Icon>;
    const Target    = () => <Icon><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>;
    const FileText  = () => <Icon><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></Icon>;
    const Printer   = () => <Icon><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></Icon>;

    const ensureArray = (value) => Array.isArray(value) ? value : [];
    const label = (value) => String(value || 'unknown').replace(/\b\w/g, c => c.toUpperCase());

    /* ─────────────────────────────────────────────────────────────────────────
       PROFESSIONAL HTML REPORT BUILDER
       Produces a fully self-contained HTML document that looks like a real
       paid consulting deliverable and prints cleanly to PDF.
    ───────────────────────────────────────────────────────────────────────── */
    function buildHtmlReport(analysis, keywords) {
      const ts = new Date().toLocaleString('en-US', { dateStyle: 'long', timeStyle: 'short' });

      const scoreColor = (s) => s >= 80 ? '#065f46' : s >= 60 ? '#92400e' : '#991b1b';
      const scoreBg   = (s) => s >= 80 ? '#d1fae5' : s >= 60 ? '#fef3c7' : '#fee2e2';
      const esc = (str) => String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      const li = (arr) => ensureArray(arr).map(i => `<li>${esc(i)}</li>`).join('') || '<li>Not specified</li>';

      const gapCards = (plans) => ensureArray(plans).map((g, gi) => `
        <div class="gap-card">
          <div class="gap-num">Gap Play ${gi + 1}</div>
          <h4 class="gap-title">${esc(g.gap)}</h4>
          <div class="mini-grid">
            <div class="mini-block"><div class="mini-lbl">Why Buyers Care</div><div>${esc(g.whyItMatters)}</div></div>
            <div class="mini-block"><div class="mini-lbl">Money Move</div><div>${esc(g.moneyMove)}</div></div>
            <div class="mini-block"><div class="mini-lbl">Named Offer</div><div>${esc(g.offer)}</div></div>
            <div class="mini-block"><div class="mini-lbl">Price Logic</div><div>${esc(g.priceLogic)}</div></div>
            <div class="mini-block"><div class="mini-lbl">Proof To Collect</div><div>${esc(g.proofToCollect)}</div></div>
            <div class="mini-block"><div class="mini-lbl">First Campaign</div><div>${esc(g.firstCampaign)}</div></div>
          </div>
          <div class="exec-box">
            <div class="exec-lbl">Execution Plan</div>
            <ol>${ensureArray(g.executionPlan).map(s => `<li>${esc(s)}</li>`).join('')}</ol>
          </div>
        </div>`).join('');

      const nicheCards = ensureArray(analysis.niches).map((n, idx) => `
        <div class="niche-card">
          <div class="niche-header">
            <div class="niche-header-text">
              <div class="niche-eyebrow">Niche Deep-Dive &middot; #${idx + 1}</div>
              <h3 class="niche-title">${esc(n.keyword)}</h3>
              <p class="niche-thesis">${esc(n.marketThesis)}</p>
            </div>
            <div class="score-badge" style="background:${scoreBg(n.opportunityScore)};color:${scoreColor(n.opportunityScore)}">
              <div class="score-num">${n.opportunityScore}</div>
              <div class="score-sub">Opportunity</div>
            </div>
          </div>

          <div class="metrics-row">
            ${[['Trend',label(n.trend)],['Search Vol.',label(n.searchVolume)],['Competition',label(n.competition)],['Buy Intent',label(n.buyIntent)],['Confidence',n.confidence||'Medium']]
              .map(([l,v]) => `<div class="metric"><div class="metric-lbl">${l}</div><div class="metric-val">${v}</div></div>`).join('')}
          </div>

          <div class="two-col">
            <div class="info-block"><div class="info-lbl">Buyer Pain</div><p>${esc(n.buyerPain)}</p></div>
            <div class="info-block"><div class="info-lbl">Target Buyer</div><p>${esc(n.targetBuyer)}</p></div>
            <div class="info-block"><div class="info-lbl">Money Path</div><p>${esc(n.moneyPath)}</p></div>
            <div class="info-block"><div class="info-lbl">Pricing Strategy</div><p>${esc(n.pricingStrategy)}</p></div>
          </div>

          <div class="three-col">
            <div class="list-block"><div class="list-lbl">Offer Stack</div><ol>${li(n.offerStack)}</ol></div>
            <div class="list-block"><div class="list-lbl">Competitor Gaps</div><ol>${li(n.competitorGaps)}</ol></div>
            <div class="list-block"><div class="list-lbl">Go-To-Market</div><ol>${li(n.goToMarket)}</ol></div>
            <div class="list-block"><div class="list-lbl">Campaign Angles</div><ol>${li(n.contentAngles)}</ol></div>
            <div class="list-block"><div class="list-lbl">Validation Plan</div><ol>${li(n.validationPlan)}</ol></div>
            <div class="list-block danger"><div class="list-lbl">Risk Flags</div><ol>${li(n.riskFlags)}</ol></div>
          </div>

          ${ensureArray(n.gapMonetizationPlan).length ? `
          <div class="gap-section">
            <div class="gap-section-title">&#9889; Competitor Gap &rarr; Money Plan</div>
            <p class="gap-section-sub">What the competition is missing, why the buyer cares, and exactly how to turn each weakness into revenue.</p>
            ${gapCards(n.gapMonetizationPlan)}
          </div>` : ''}

          <div class="thirty-box">
            <div class="thirty-lbl">First 30 Days</div>
            <ol class="thirty-list">
              ${ensureArray(n.firstThirtyDays).map((s,i) => `<li><strong>Step ${i+1}:</strong> ${esc(s)}</li>`).join('')}
            </ol>
          </div>
        </div>`).join('');

      return `<!DOCTYPE html>

<title>${esc(analysis.reportTitle) || 'Scout-Faire Report'}</title>
<style>

/* Cover */

.cover-eye{font-size:11px;font-weight:700;letter-spacing:.25em;color:#fbbf24;text-transform:uppercase;margin-bottom:10px}
.cover-title{font-size:36px;font-weight:900;line-height:1.1;margin-bottom:6px}

.metric-val{font-size:13px;font-weight:800;color:#0f172a}

/* Info blocks */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.info-block{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px}
.info-lbl{font-size:9px;font-weight:800;text-transform:uppercase;color:#94a3b8;margin-bottom:5px}
.info-block p{color:#334155;font-size:12px;line-height:1.6}

/* List panels */
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}

.list-block.danger{background:#fff1f2;border-color:#fecdd3}

.gap-section{background:#fffbeb;border:2px solid #fde68a;border-radius:14px;padding:22px;margin-bottom:20px}

.gap-section-sub{font-size:12px;color:#78350f;margin-bottom:16px}
.gap-card{background:#fff;border:1px solid #fde68a;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.gap-num{font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#b45309;margin-bottom:5px}
.gap-title{font-size:14px;font-weight:800;color:#0f172a;margin-bottom:12px}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mini-block{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px}
.mini-lbl{font-size:9px;font-weight:800;text-transform:uppercase;color:#94a3b8;margin-bottom:3px}
.mini-block div:last-child{font-size:11px;color:#334155;line-height:1.5}
.exec-box{background:#0f172a;color:#fff;border-radius:10px;padding:14px}
.exec-lbl{font-size:10px;font-weight:800;text-transform:uppercase;color:#fbbf24;margin-bottom:8px}
.exec-box ol{padding-left:16px}
.exec-box li{font-size:11px;margin-bottom:5px;color:#e2e8f0}

.em-block ol{padding-left:16px}
.em-block li{font-size:11px;color:#14532d;margin-bottom:4px}

/* Doc footer */
.doc-footer{text-align:center;padding:28px 24px;color:#94a3b8;font-size:11px;border-top:1px solid #e2e8f0}

/* Print */
@media print{
  body{background:#fff}
  .niche-card,.exec-card,.footer-card{box-shadow:none!important;break-inside:avoid}

}
</style>
</head>

    }

BUYER PAIN
${n.buyerPain||''}

TARGET BUYER
${n.targetBuyer||''}

MONEY PATH
${n.moneyPath||''}

PRICING STRATEGY
${n.pricingStrategy||''}

OFFER STACK
${bl(n.offerStack)}

COMPETITOR GAPS
${bl(n.competitorGaps)}

GAP MONETIZATION PLAN
${gapText(n.gapMonetizationPlan)}

GO-TO-MARKET
${bl(n.goToMarket)}

CAMPAIGN ANGLES
${bl(n.contentAngles)}

VALIDATION PLAN
${bl(n.validationPlan)}

RISK FLAGS
${bl(n.riskFlags)}

FIRST 30 DAYS
${bl(n.firstThirtyDays)}
`).join('\n')}

${line}
STRATEGIC OUTLOOK
${line}

EMERGING OPPORTUNITIES
${bl(analysis.emergingOpportunities)}

90-DAY ROADMAP
${bl(analysis.ninetyDayRoadmap)}

KEY PERFORMANCE INDICATORS
${bl(analysis.kpis)}

${line}
Powered by Scout-Faire | Freedom Uprise Command Intelligence
`;
    }

    /* ─── Main App ─────────────────────────────────────────────────────────── */
    function NicheAnalyzer() {
      const [analysis, setAnalysis] = useState(null);
      const [loading, setLoading]   = useState(false);
      const [keywords, setKeywords] = useState('');
      const [error, setError]       = useState('');

      const analyzeNiche = async () => {
        if (!keywords.trim()) { setError('Enter at least one keyword, niche, industry, or business idea.'); return; }
        setLoading(true); setError(''); setAnalysis(null);
        try {
          const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ keywords })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Analysis failed');
          setAnalysis(data.analysis);
        } catch (err) {
          setError(err.message || 'Analysis failed. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      const scoreClass = (score) => {
        if (score >= 80) return 'text-emerald-800 bg-emerald-50 border-emerald-300';
        if (score >= 60) return 'text-amber-800 bg-amber-50 border-amber-300';
        return 'text-rose-800 bg-rose-50 border-rose-300';
      };

      const intentClass = (intent) => {
        if (intent === 'high')   return 'bg-emerald-100 text-emerald-900 border-emerald-300';
        if (intent === 'medium') return 'bg-amber-100 text-amber-900 border-amber-300';
        return 'bg-slate-100 text-slate-800 border-slate-300';
      };

      /* Export: open polished HTML report in new tab */
      const exportHtmlReport = () => {
        if (!analysis) return;
        const html = buildHtmlReport(analysis, keywords);
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url  = URL.createObjectURL(blob);
        const win  = window.open(url, '_blank');
        if (win) win.onload = () => URL.revokeObjectURL(url);
      };

      /* Export: download polished HTML file */
      const downloadHtmlReport = () => {
        if (!analysis) return;
        const html = buildHtmlReport(analysis, keywords);
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = `scout-faire-report-${Date.now()}.html`; a.click();
        URL.revokeObjectURL(url);
      };

      /* Export: download plain text */
      const downloadTextReport = () => {
        if (!analysis) return;
        const text = buildTextReport(analysis, keywords);
        const blob = new Blob([text], { type: 'text/plain' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = `scout-faire-report-${Date.now()}.txt`; a.click();
        URL.revokeObjectURL(url);
      };

      const printReport = () => window.print();

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 p-4 md:p-8">
          <div className="w-full max-w-7xl mx-auto">

            {/* ── Header / Input ── */}
            <div className="no-print bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/10 p-6 md:p-8 mb-8">
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-6 mb-8">
                <div className="flex items-center gap-4">
                  <div className="p-4 bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl shadow-lg text-slate-950">
                    <TrendingUp />
                  </div>
                  <div>
                    <p className="text-xs uppercase tracking-[0.35em] text-amber-300 font-bold">Freedom Uprise Intelligence</p>
                    <h1 className="text-3xl md:text-5xl font-black tracking-tight">Scout-Faire</h1>
                    <p className="text-slate-300 mt-1">Pro / Enterprise intelligence that finds competitor gaps and turns them into money moves.</p>
                  </div>
                </div>
                <div className="grid grid-cols-3 gap-3 text-center text-xs md:text-sm">
                  <div className="bg-white/10 rounded-2xl p-3 border border-white/10"><b className="block text-amber-300">Gaps</b>Competitors</div>
                  <div className="bg-white/10 rounded-2xl p-3 border border-white/10"><b className="block text-amber-300">Money</b>Gap Plays</div>
                  <div className="bg-white/10 rounded-2xl p-3 border border-white/10"><b className="block text-amber-300">Motion</b>90 Days</div>
                </div>
              </div>

              <div className="space-y-4">
                <label className="block text-sm font-bold text-slate-200">Enter niches, markets, business ideas, or customer problems</label>
                <textarea
                  value={keywords}
                  onChange={(e) => setKeywords(e.target.value)}
                  placeholder="e.g., local roofing lead generation, AI bookkeeping for contractors, senior relocation services"
                  className="w-full px-5 py-4 bg-white text-slate-950 border-2 border-transparent rounded-2xl focus:border-amber-400 focus:ring-4 focus:ring-amber-400/20 transition-all outline-none placeholder:text-slate-400 resize-none"
                  rows="3"
                />
                {error && (
                  <div className="flex items-start gap-3 p-4 bg-rose-500/10 border border-rose-400/30 rounded-xl text-rose-100">
                    <AlertCircle /> <span className="text-sm">{error}</span>
                  </div>
                )}
                <button
                  onClick={analyzeNiche}
                  disabled={loading}
                  className="w-full bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 py-4 rounded-2xl font-black hover:from-amber-300 hover:to-orange-400 transition-all shadow-lg disabled:opacity-60 flex items-center justify-center gap-2"
                >
                  {loading ? <><Loader2 /><span>Building Strategy Report...</span></> : <><Search /><span>Generate Pro Report</span></>}
                </button>
              </div>
            </div>

            {/* ── Report ── */}
            {analysis && (
              <div className="space-y-8 text-slate-950">

                {/* Report header card */}
                <div className="report-card bg-white rounded-3xl shadow-2xl border border-slate-200 p-6 md:p-8">
                  <div className="flex flex-col md:flex-row md:items-start justify-between gap-5 mb-6">
                    <div>
                      <p className="text-xs uppercase tracking-[0.3em] font-black text-amber-600">{analysis.tierPositioning || 'Pro / Enterprise'}</p>
                      <h2 className="text-3xl md:text-4xl font-black text-slate-950 mt-2">{analysis.reportTitle}</h2>
                      <p className="text-slate-500 mt-2">Generated {new Date().toLocaleDateString()} for: {analysis.generatedFor || keywords}</p>
                    </div>

                    {/* ── Three export options ── */}
                    <div className="no-print flex flex-wrap gap-2 items-start">
                      <button
                        onClick={exportHtmlReport}
                        title="Open a polished, printable report in a new tab"
                        className="flex items-center gap-2 px-4 py-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-500 font-bold text-sm whitespace-nowrap"
                      ><FileText size={16} /> Professional Report</button>
                      <button
                        onClick={downloadHtmlReport}
                        title="Download the styled report as an HTML file"
                        className="flex items-center gap-2 px-4 py-3 bg-slate-950 text-white rounded-xl hover:bg-slate-800 font-bold text-sm whitespace-nowrap"
                      ><Download size={16} /> Download HTML</button>
                      <button
                        onClick={downloadTextReport}
                        title="Download plain-text version"
                        className="flex items-center gap-2 px-4 py-3 bg-slate-200 text-slate-800 rounded-xl hover:bg-slate-300 font-bold text-sm whitespace-nowrap"
                      ><Download size={16} /> .TXT</button>
                      <button
                        onClick={printReport}
                        title="Print this page or save as PDF"
                        className="flex items-center gap-2 px-4 py-3 bg-amber-500 text-slate-950 rounded-xl hover:bg-amber-400 font-bold text-sm whitespace-nowrap"
                      ><Printer size={16} /> Print / PDF</button>
                    </div>
                  </div>

                  <div className="grid md:grid-cols-3 gap-4 mb-6">
                    <div className="p-5 rounded-2xl bg-slate-50 border border-slate-200"><div className="text-xs font-black uppercase text-slate-500 mb-2">Best Bet</div><div className="font-black text-lg">{analysis.bestBet}</div></div>
                    <div className="p-5 rounded-2xl bg-slate-50 border border-slate-200"><div className="text-xs font-black uppercase text-slate-500 mb-2">Confidence</div><div className="font-black text-lg">{analysis.confidenceLevel}</div></div>
                    <div className="p-5 rounded-2xl bg-slate-50 border border-slate-200"><div className="text-xs font-black uppercase text-slate-500 mb-2">Verdict</div><div className="font-black text-lg">{analysis.portfolioVerdict}</div></div>
                  </div>

                  <div className="grid lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2 bg-indigo-50 rounded-2xl p-6 border border-indigo-100">
                      <div className="flex items-center gap-3 mb-3 text-indigo-900"><Lightbulb /><h3 className="font-black text-xl">Executive Summary</h3></div>
                      <p className="leading-relaxed text-slate-800">{analysis.executiveSummary}</p>
                    </div>
                    <div className="bg-rose-50 rounded-2xl p-6 border border-rose-100">
                      <div className="flex items-center gap-3 mb-3 text-rose-900"><Shield /><h3 className="font-black text-xl">Strategic Warnings</h3></div>
                      <ul className="space-y-2 text-sm text-slate-800">
                        {ensureArray(analysis.strategicWarnings).map((item, i) => <li key={i}>• {item}</li>)}
                      </ul>
                    </div>
                  </div>
                </div>

                {/* Niche deep-dive cards */}
                {ensureArray(analysis.niches).map((niche, index) => (
                  <div key={index} className="report-card bg-white rounded-3xl shadow-2xl border border-slate-200 p-6 md:p-8">
                    <div className="flex flex-col lg:flex-row lg:items-start justify-between gap-6 mb-6">
                      <div>
                        <p className="text-xs uppercase tracking-[0.25em] text-slate-500 font-black">Niche Deep-Dive</p>
                        <h3 className="text-3xl font-black text-slate-950 mt-1">{niche.keyword}</h3>
                        <p className="text-slate-700 leading-relaxed mt-3 max-w-4xl">{niche.marketThesis}</p>
                      </div>
                      <div className={`inline-flex flex-col items-center px-7 py-5 rounded-2xl border-2 ${scoreClass(niche.opportunityScore)}`}>
                        <div className="text-5xl font-black">{niche.opportunityScore}</div>
                        <div className="text-xs font-black uppercase tracking-wide">Opportunity</div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
                      <Metric label="Trend"       value={label(niche.trend)} />
                      <Metric label="Search"      value={label(niche.searchVolume)} />
                      <Metric label="Competition" value={label(niche.competition)} />
                      <Metric label="Buy Intent"  value={label(niche.buyIntent)} className={intentClass(niche.buyIntent)} />
                      <Metric label="Confidence"  value={niche.confidence || 'Medium'} />
                    </div>

                    <div className="grid lg:grid-cols-2 gap-5 mb-6">
                      <Panel title="Buyer Pain"       icon={<Target />}>{niche.buyerPain}</Panel>
                      <Panel title="Target Buyer"     icon={<Target />}>{niche.targetBuyer}</Panel>
                      <Panel title="Money Path"       icon={<BarChart3 />}>{niche.moneyPath}</Panel>
                      <Panel title="Pricing Strategy" icon={<BarChart3 />}>{niche.pricingStrategy}</Panel>
                    </div>

                    <div className="grid lg:grid-cols-3 gap-5">
                      <ListPanel title="Offer Stack"          items={niche.offerStack} />
                      <ListPanel title="Competitor Gaps"      items={niche.competitorGaps} />
                      <ListPanel title="Go-To-Market"         items={niche.goToMarket} />
                      <ListPanel title="Campaign Angles"      items={niche.contentAngles} />
                      <ListPanel title="Validation Plan"      items={niche.validationPlan} />
                      <ListPanel title="Risk Flags"           items={niche.riskFlags} danger />
                    </div>

                    <GapMonetizationPanel plans={niche.gapMonetizationPlan} />

                    <div className="mt-6 bg-slate-950 text-white rounded-2xl p-6">
                      <h4 className="font-black text-xl mb-4 text-amber-300">First 30 Days</h4>
                      <ol className="grid md:grid-cols-2 gap-3">
                        {ensureArray(niche.firstThirtyDays).map((item, i) => (
                          <li key={i} className="bg-white/10 rounded-xl p-4 border border-white/10"><b>Step {i + 1}:</b> {item}</li>
                        ))}
                      </ol>
                    </div>
                  </div>
                ))}

                {/* Roadmap & KPIs */}
                <div className="report-card bg-white rounded-3xl shadow-2xl border border-slate-200 p-6 md:p-8">
                  <div className="grid lg:grid-cols-3 gap-6">
                    <ListPanel title="Emerging Opportunities" items={analysis.emergingOpportunities} />
                    <ListPanel title="90-Day Roadmap"         items={analysis.ninetyDayRoadmap} />
                    <ListPanel title="KPIs to Watch"          items={analysis.kpis} />
                  </div>
                </div>
              </div>
            )}

            <div className="no-print mt-8 text-center text-sm text-slate-400">
              Powered by <span className="font-bold text-amber-300">Scout-Faire</span> | Freedom Uprise Command Intelligence
            </div>
          </div>
        </div>
      );
    }

    function Metric({ label, value, className = '' }) {
      return (
        <div className={`p-4 rounded-2xl border bg-slate-50 border-slate-200 ${className}`}>
          <div className="text-xs font-black uppercase opacity-70 mb-1">{label}</div>
          <div className="font-black">{value}</div>
        </div>
      );
    }

    function Panel({ title, icon, children }) {
      return (
        <div className="bg-slate-50 rounded-2xl p-5 border border-slate-200">
          <div className="flex items-center gap-2 mb-2 text-slate-950 font-black">{icon}<h4>{title}</h4></div>
          <p className="text-slate-700 leading-relaxed">{children}</p>
        </div>
      );
    }

    function GapMonetizationPanel({ plans }) {
      const safePlans = ensureArray(plans);
      return (
        <div className="mt-6 bg-amber-50 border-2 border-amber-200 rounded-2xl p-6">
          <div className="flex items-center gap-3 mb-5 text-slate-950"><BarChart3 /><h4 className="font-black text-2xl">Competitor Gap → Money Plan</h4></div>
          <p className="text-slate-700 mb-5 leading-relaxed">This is the enterprise section: what the competition is missing, why the buyer cares, and exactly how to turn that weakness into revenue.</p>
          <div className="space-y-5">
            {safePlans.length ? safePlans.map((plan, i) => (
              <div key={i} className="bg-white rounded-2xl border border-amber-200 p-5 shadow-sm">
                <div className="text-xs font-black uppercase tracking-[0.2em] text-amber-700 mb-2">Gap Play {i + 1}</div>
                <h5 className="font-black text-xl text-slate-950 mb-3">{plan.gap || 'Untitled competitor gap'}</h5>
                <div className="grid lg:grid-cols-2 gap-4 text-sm">
                  <MiniBlock label="Why Buyers Care"  value={plan.whyItMatters} />
                  <MiniBlock label="Money Move"        value={plan.moneyMove} />
                  <MiniBlock label="Named Offer"       value={plan.offer} />
                  <MiniBlock label="Price Logic"       value={plan.priceLogic} />
                  <MiniBlock label="Proof To Collect"  value={plan.proofToCollect} />
                  <MiniBlock label="First Campaign"    value={plan.firstCampaign} />
                </div>
                <div className="mt-4 bg-slate-950 text-white rounded-xl p-4">
                  <div className="font-black text-amber-300 mb-2">Execution Plan</div>
                  <ol className="space-y-2 text-sm">
                    {ensureArray(plan.executionPlan).map((step, si) => <li key={si}><b>{si + 1}.</b> {step}</li>)}
                  </ol>
                </div>
              </div>
            )) : <div className="text-slate-500">No gap monetization plan was returned.</div>}
          </div>
        </div>
      );
    }

    function MiniBlock({ label, value }) {
      return (
        <div className="bg-slate-50 border border-slate-200 rounded-xl p-4">
          <div className="text-xs font-black uppercase text-slate-500 mb-1">{label}</div>
          <div className="text-slate-800 leading-relaxed">{value || 'Not specified'}</div>
        </div>
      );
    }

    function ListPanel({ title, items, danger = false }) {
      const safeItems = ensureArray(items);
      return (
        <div className={`${danger ? 'bg-rose-50 border-rose-100' : 'bg-slate-50 border-slate-200'} rounded-2xl p-5 border`}>
          <h4 className="font-black text-slate-950 mb-4">{title}</h4>
          <ul className="space-y-3 text-sm text-slate-700">
            {safeItems.length
              ? safeItems.map((item, i) => <li key={i} className="flex gap-2"><span className="font-black text-amber-600">{i + 1}.</span><span>{item}</span></li>)
              : <li className="text-slate-400">Not specified</li>}
          </ul>
        </div>
      );
    }

    ReactDOM.render(<NicheAnalyzer />, document.getElementById('root'));
  </script>
</body>
</html>
